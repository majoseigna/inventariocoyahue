<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eliminar Producto - Grupo Coyahue</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Estilos Generales -->
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>

<body>

  <!-- TOPBAR -->
  <nav class="topbar">
    <div class="user-menu dropdown">
      <a class="dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
        <i class="bi bi-person-circle me-2"></i>Usuario
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="../ajustes/perfil.html"><i class="bi bi-gear me-2"></i>Configuración</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="../../paginas/login/login.html"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>

  <!-- Contenedor de la App -->
  <div class="app-container">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo-container">
        <img src="../../src/img/logo.png" alt="Logo Grupo Coyahue">
      </div>
      <ul class="nav flex-column w-100 px-2">
        <li><a href="../../index.html" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
        <!-- Sigue activo "Productos" -->
        <li><a href="listar.html" class="nav-link active"><i class="bi bi-box-seam"></i> Productos</a></li>
        <li><a href="../categorias/listar.html" class="nav-link"><i class="bi bi-tags"></i> Categorías</a></li>
        <li><a href="../proveedores/listar.html" class="nav-link"><i class="bi bi-truck"></i> Proveedores</a></li>
        <li><a href="../reportes/listar.html" class="nav-link"><i class="bi bi-graph-up"></i> Reportes</a></li>
      </ul>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <!-- Centramos el contenido en la página para darle énfasis -->
      <div class="container-fluid d-flex justify-content-center align-items-start" style="padding-top: 5vh;">
        
        <!-- Tarjeta de confirmación con cabecera roja -->
        <div class="card text-center shadow-lg" style="max-width: 550px; border: none; border-radius: 10px; overflow: hidden;">
          
          <div class="card-header bg-danger text-white p-4">
            <h3 class="fw-bold mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Eliminación</h3>
          </div>

          <div class="card-body p-4">
            <p class="fs-5">¿Estás seguro de que deseas eliminar permanentemente este producto?</p>
            
            <!-- Mostramos la info del producto a borrar -->
            <div id="producto-info" class="bg-light p-3 rounded mb-4 border text-start">
              Cargando datos del producto...
            </div>

            <p class="text-muted small">Esta acción no se puede deshacer.</p>

            <form id="formEliminarProducto">
              <!-- Campo oculto para guardar el ID -->
              <input type="hidden" id="idProducto" name="id">
              
              <div class="d-grid gap-2 d-sm-flex justify-content-center mt-4">
                <button type="submit" class="btn btn-danger btn-lg"><i class="bi bi-trash me-2"></i>Sí, Eliminar</button>
                <a href="listar.html" class="btn btn-secondary btn-lg"><i class="bi bi-x-circle me-2"></i>Cancelar</a>
              </div>
            </form>
          </div>
        </div>

      </div>
      <!-- No incluimos footer en la página de eliminar para no distraer -->
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- El mismo JS se encarga de esta página -->
  <script src="../../src/js/productos.js"></script>
</body>
</html>
