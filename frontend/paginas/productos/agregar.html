<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agregar Producto - Grupo Coyahue</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Estilos Generales -->
  <link rel="stylesheet" href="../../src/css/styles.css">
</head>

<body>

  <!-- TOPBAR -->
  <nav class="topbar">
    <div class="user-menu dropdown">
      <a class="dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
        <i class="bi bi-person-circle me-2"></i>Usuario
      </a>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="../ajustes/perfil.html"><i class="bi bi-gear me-2"></i>Configuración</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="../../paginas/login/login.html"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</a></li>
      </ul>
    </div>
  </nav>

  <!-- Contenedor de la App -->
  <div class="app-container">
    
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="logo-container">
        <img src="../../src/img/logo.png" alt="Logo Grupo Coyahue">
      </div>
      <ul class="nav flex-column w-100 px-2">
        <li><a href="../../index.html" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a></li>
        <!-- Sigue activo "Productos" -->
        <li><a href="listar.html" class="nav-link active"><i class="bi bi-box-seam"></i> Productos</a></li>
        <li><a href="../categorias/listar.html" class="nav-link"><i class="bi bi-tags"></i> Categorías</a></li>
        <li><a href="../proveedores/listar.html" class="nav-link"><i class="bi bi-truck"></i> Proveedores</a></li>
        <li><a href="../reportes/listar.html" class="nav-link"><i class="bi bi-graph-up"></i> Reportes</a></li>
      </ul>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <div class="container-fluid">
        
        <div class="mb-4">
          <h2 class="fw-bold text-primary">Agregar Nuevo Producto</h2>
          <p class="text-muted">Completa los campos para registrar un nuevo equipo.</p>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="card">
          <form id="formAgregarProducto">
            <!-- Formulario basado en Mockup Pág 27 -->
            <div class="row g-3">
              
              <div class="col-md-4">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" name="tipo" class="form-select" required>
                  <option value="" disabled selected>Selecciona un tipo...</option>
                  <option value="PC">PC</option>
                  <option value="Notebook">Notebook</option>
                  <option value="Impresora">Impresora</option>
                  <option value="Monitor">Monitor</option>
                  <option value="Tablet">Tablet</option>
                  <option value="Celular">Celular</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="marca" class="form-label">Marca</label>
                <input type="text" id="marca" name="marca" class="form-control" required>
              </div>

              <div class="col-md-4">
                <label for="modelo" class="form-label">Modelo</label>
                <input type="text" id="modelo" name="modelo" class="form-control">
              </div>

              <div class="col-md-4">
                <label for="serial" class="form-label">Número de Serie</label>
                <input type="text" id="serial" name="serial" class="form-control">
              </div>
              
              <div class="col-md-4">
                <label for="fecha_compra" class="form-label">Fecha de Compra</label>
                <input type="date" id="fecha_compra" name="fecha_compra" class="form-control">
              </div>

              <div class="col-md-4">
                <label for="proveedor" class="form-label">Proveedor</label>
                <input type="text" id="proveedor" name="proveedor" class="form-control">
              </div>

              <div class="col-md-4">
                <label for="estado" class="form-label">Estado</label>
                <select id="estado" name="estado" class="form-select" required>
                  <option value="Activo" selected>Activo</option>
                  <option value="Disponible">Disponible</option>
                  <option value="Dado de baja">Dado de baja</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="rut" class="form-label">RUT Asociado</label>
                <input type="text" id="rut" name="rut" class="form-control" placeholder="12345678-9">
              </div>

              <div class="col-md-4">
                <label for="usuario" class="form-label">Usuario Responsable</label>
                <input type="text" id="usuario" name="usuario" class="form-control">
              </div>

              <!-- Botones -->
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-2"></i>Guardar Producto</button>
                <a href="listar.html" class="btn btn-secondary"><i class="bi bi-x-circle me-2"></i>Cancelar</a>
              </div>

            </div>
          </form>
        </div>

        <div class="footer">
          <p>© 2025 Grupo Coyahue — Sistema de Inventario</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 
    Cargamos el MISMO script. 
    Él sabrá que está en la página "agregar" 
    porque encontrará el form#formAgregarProducto
  -->
  <script src="../../src/js/productos.js"></script>
</body>
</html>
