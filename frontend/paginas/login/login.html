<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesión - Inventario Coyahue</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="../../src/css/login.css">
</head>

<body>
  <!-- Barra superior con logo -->
  <nav class="navbar navbar-dark" style="background-color: #002a4d;">
    <div class="container d-flex justify-content-center align-items-center py-2">
      <img src="../../src/img/logo.png" alt="Logo Grupo Coyahue" class="logo-navbar">
    </div>
  </nav>

  <!-- Contenedor principal -->
  <div class="login-container d-flex justify-content-center align-items-center">
    <div class="login-card shadow p-4">
      <h4 class="fw-bold text-primary text-center mb-3">Inicio de Sesión</h4>
      <p class="text-muted text-center mb-4">Accede al sistema de Inventario Coyahue</p>

      <form id="loginForm">
        <div class="mb-3">
          <label for="usuario" class="form-label fw-semibold">Usuario</label>
          <input type="text" id="usuario" class="form-control" placeholder="Ingrese su usuario" required>
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label fw-semibold">Contraseña</label>
          <input type="password" id="contrasena" class="form-control" placeholder="Ingrese su contraseña" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Ingresar</button>

        <p class="text-center text-muted mt-4 mb-0">
          ¿Olvidaste tu contraseña? 
          <a href="#" class="text-decoration-none fw-semibold" style="color: #002a4d;">Recupérala aquí</a>
        </p>
      </form>
    </div>
  </div>

  <script src="../../src/js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
